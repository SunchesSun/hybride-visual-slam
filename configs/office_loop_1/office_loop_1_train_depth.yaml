source:
  kind: timestamp_manifest
  manifest_path: /home/sunches/datasets/office_loop_1_train/rgb.txt
  dataset_root: /home/sunches/datasets/office_loop_1_train
  replay_realtime: false

orbslam:
  vocab_path: /home/sunches/vkr/ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings_path: /home/sunches/datasets/office_loop_1_train/office_loop.yaml
  use_viewer: false

processing:
  pipeline: ade_mono_depth
  optimization:
    depth_input_size: 192
    depth_inference_stride: 2
  image_enhancement:
    enabled: false
  depth_model:
    backend: zoedepth
    weights_path: auto
    device: cuda
    pad_input: false
  depth_guidance:
    depth_threshold_m: 60.0
    far_point_drop_probability: 0.0
    recursive_keep_ratio: 0.98
    max_recursion_depth: 1
    min_block_points: 64
    min_feature_retention_ratio: 0.92
    min_feature_retention_count: 700
    max_invalid_depth_ratio: 0.15
    activation_min_ok_frames: 20
    recovery_cooldown_frames: 45
    min_depth_score_for_guidance: 0.20

runtime:
  live_view: false
  log_mode: fps_adaptive
  output_dir: ../runs/office_loop_1_train_depth/{timestamp}
  ground_truth_path: /home/sunches/datasets/office_loop_1_train/true/GNSSPoses_tum.txt
  # max_frames: 1000
